<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 地面阴影 -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2"/>
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 主体渐变 -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#5B5FEF"/>
      <stop offset="50%" style="stop-color:#4A4DE0"/>
      <stop offset="100%" style="stop-color:#3B3DB5"/>
    </linearGradient>
    
    <!-- 主体高光 -->
    <linearGradient id="bodyHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
    
    <!-- 顶部渐变 -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#7C7FFF"/>
      <stop offset="100%" style="stop-color:#5B5FEF"/>
    </linearGradient>
    
    <!-- 窗户发光 -->
    <radialGradient id="windowGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFE87C"/>
      <stop offset="50%" style="stop-color:#FFD93D"/>
      <stop offset="100%" style="stop-color:#F5A623"/>
    </radialGradient>
    
    <!-- 魔法阵光环 -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.6"/>
      <stop offset="40%" style="stop-color:#7C3AED;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 门发光 -->
    <radialGradient id="doorGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#C4B5FD;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.4"/>
    </radialGradient>
  </defs>
  
  <!-- 地面阴影 -->
  <ellipse cx="64" cy="120" rx="44" ry="7" fill="url(#shadow)"/>
  
  <!-- 地面线 -->
  <path d="M14,118 L114,118" stroke="#B8C5D6" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- ===== 底座 ===== -->
  <rect x="28" y="104" width="72" height="14" rx="6" fill="#6D6FE0" stroke="#5153C4" stroke-width="2"/>
  <rect x="30" y="104" width="68" height="5" rx="3" fill="#8486FF" opacity="0.3"/>
  <!-- 底座装饰铆钉 -->
  <circle cx="38" cy="111" r="2.5" fill="#7C7FFF" stroke="#5153C4" stroke-width="1"/>
  <circle cx="90" cy="111" r="2.5" fill="#7C7FFF" stroke="#5153C4" stroke-width="1"/>
  
  <!-- ===== 主体 ===== -->
  <rect x="32" y="48" width="64" height="58" rx="8" fill="url(#bodyGrad)" stroke="#3B3DB5" stroke-width="2.5"/>
  <rect x="32" y="48" width="64" height="58" rx="8" fill="url(#bodyHighlight)"/>
  
  <!-- 主体装饰带 -->
  <rect x="32" y="72" width="64" height="4" rx="2" fill="#6D6FE0" opacity="0.5"/>
  <rect x="32" y="88" width="64" height="4" rx="2" fill="#6D6FE0" opacity="0.3"/>
  
  <!-- 装饰花纹 -->
  <circle cx="64" cy="80" r="12" fill="none" stroke="#6D6FE0" stroke-width="1.5" opacity="0.3"/>
  <circle cx="64" cy="80" r="8" fill="none" stroke="#6D6FE0" stroke-width="1" opacity="0.2"/>
  
  <!-- ===== 拱门 ===== -->
  <path d="M52,104 L52,90 Q52,78 64,78 Q76,78 76,90 L76,104" fill="url(#doorGlow)" stroke="#3B3DB5" stroke-width="2"/>
  <path d="M55,104 L55,92 Q55,82 64,82 Q73,82 73,92 L73,104" fill="#7C3AED" opacity="0.3"/>
  
  <!-- 门内传送光效 -->
  <ellipse cx="64" cy="100" rx="8" ry="3" fill="#A78BFA" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- ===== 窗户 ===== -->
  <!-- 左窗 -->
  <rect x="42" y="56" width="14" height="16" rx="5" fill="#2A2B8A" stroke="#3B3DB5" stroke-width="2"/>
  <rect x="44" y="58" width="10" height="12" rx="3" fill="url(#windowGlow)"/>
  <line x1="49" y1="58" x2="49" y2="70" stroke="#3B3DB5" stroke-width="1.5"/>
  <line x1="44" y1="64" x2="54" y2="64" stroke="#3B3DB5" stroke-width="1.5"/>
  <!-- 窗光晕 -->
  <ellipse cx="49" cy="64" rx="8" ry="8" fill="#FFD93D" opacity="0.1"/>
  
  <!-- 右窗 -->
  <rect x="72" y="56" width="14" height="16" rx="5" fill="#2A2B8A" stroke="#3B3DB5" stroke-width="2"/>
  <rect x="74" y="58" width="10" height="12" rx="3" fill="url(#windowGlow)"/>
  <line x1="79" y1="58" x2="79" y2="70" stroke="#3B3DB5" stroke-width="1.5"/>
  <line x1="74" y1="64" x2="84" y2="64" stroke="#3B3DB5" stroke-width="1.5"/>
  <ellipse cx="79" cy="64" rx="8" ry="8" fill="#FFD93D" opacity="0.1"/>
  
  <!-- ===== 屋顶 ===== -->
  <!-- 主圆顶 -->
  <ellipse cx="64" cy="48" rx="36" ry="16" fill="url(#roofGrad)" stroke="#3B3DB5" stroke-width="2.5"/>
  <ellipse cx="64" cy="48" rx="32" ry="13" fill="#7C7FFF" opacity="0.2"/>
  
  <!-- 屋顶高光 -->
  <ellipse cx="56" cy="43" rx="14" ry="7" fill="white" opacity="0.1" transform="rotate(-15,56,43)"/>
  
  <!-- 屋瓦装饰线 -->
  <path d="M32,48 Q48,40 64,48 Q80,40 96,48" fill="none" stroke="#3B3DB5" stroke-width="1" opacity="0.3"/>
  
  <!-- ===== 塔尖 ===== -->
  <!-- 尖顶 -->
  <polygon points="64,22 55,38 73,38" fill="#FFD93D" stroke="#F5A623" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="64,22 58,38 70,38" fill="#FFE87C" opacity="0.4"/>
  
  <!-- 尖顶球 -->
  <circle cx="64" cy="20" r="4.5" fill="#FFD93D" stroke="#F5A623" stroke-width="2"/>
  <circle cx="63" cy="19" r="1.5" fill="white" opacity="0.4"/>
  
  <!-- ===== 生成标记 - 旋转光环 ===== -->
  <circle cx="64" cy="20" r="8" fill="none" stroke="#FFD93D" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,4">
    <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- ===== 问号标志 ===== -->
  <text x="64" y="15" text-anchor="middle" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', Arial" font-size="16" font-weight="bold" fill="#FFE87C" stroke="#F5A623" stroke-width="0.8">?</text>
  
  <!-- ===== 底部魔法阵 ===== -->
  <ellipse cx="64" cy="111" rx="22" ry="5" fill="url(#portalGlow)"/>
  <ellipse cx="64" cy="111" rx="22" ry="5" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="64" cy="111" rx="16" ry="3.5" fill="none" stroke="#C4B5FD" stroke-width="1" opacity="0.4"/>
  
  <!-- ===== 魔法粒子 ===== -->
  <circle cx="48" cy="112" r="2" fill="#A78BFA">
    <animate attributeName="cy" values="112;108;112" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="112" r="2" fill="#C4B5FD">
    <animate attributeName="cy" values="112;107;112" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="56" cy="111" r="1.5" fill="#DDD6FE">
    <animate attributeName="cy" values="111;106;111" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="72" cy="111" r="1.5" fill="#DDD6FE">
    <animate attributeName="cy" values="111;106;111" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- ===== 侧边小装饰 ===== -->
  <!-- 左旗 -->
  <line x1="32" y1="50" x2="32" y2="38" stroke="#3B3DB5" stroke-width="1.5"/>
  <polygon points="32,38 40,41 32,44" fill="#FF6B8A" stroke="#D9406A" stroke-width="1"/>
  
  <!-- 右旗 -->
  <line x1="96" y1="50" x2="96" y2="38" stroke="#3B3DB5" stroke-width="1.5"/>
  <polygon points="96,38 88,41 96,44" fill="#FF6B8A" stroke="#D9406A" stroke-width="1"/>
</svg>